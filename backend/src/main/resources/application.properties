server.port=8080

# Database Configuration with Zero-Downtime Resilience
# When SPRING_DATASOURCE_URL is provided (e.g. Supabase or PostgreSQL), it connects to PostgreSQL.
# Otherwise, it runs resiliently on persistent embedded engine with zero crashes.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/portaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Multipart & File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom storage location for uploaded evidence
portal.upload.dir=uploads/evidence
