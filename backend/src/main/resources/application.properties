# ──────────────────────────────────────────────────────────────────────────────
# University Document Portal — Application Configuration
# ──────────────────────────────────────────────────────────────────────────────

server.port=8080

# ── Database ──────────────────────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL in the environment to switch to PostgreSQL.
# Falls back to a persistent H2 file database for local development.
spring.datasource.url=${PORTAL_DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/portaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── File uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
portal.upload.dir=${PORTAL_UPLOAD_DIR:uploads/evidence}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Add production frontend URL here when deploying, e.g.:
# portal.cors.extra-origins=https://your-app.vercel.app
portal.cors.extra-origins=

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.university.portal=INFO
logging.level.org.springframework.web=WARN
